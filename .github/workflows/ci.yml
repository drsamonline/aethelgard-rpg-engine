name: CI

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # was @v4
        with:
          node-version: 20

      - name: Syntax-check every JS file
        run: |
          fail=0
          for f in $(find js mods tools . -maxdepth 3 -name '*.js' -not -path './.git/*'); do
            node --check "$f" || { echo "SYNTAX FAIL: $f"; fail=1; }
          done
          exit $fail

      - name: Validate JSON files
        run: |
          fail=0
          for f in $(find . -name '*.json' -not -path './.git/*' -not -path './node_modules/*'); do
            python3 -m json.tool "$f" > /dev/null || { echo "JSON FAIL: $f"; fail=1; }
          done
          exit $fail

      - name: Run test suites
        run: |
          # The engine-only repo keeps test8 (static-audit), test9 (service worker)
          # and test10 (save import); the rest went with the game content. A FIXED
          # list here is how a new suite gets written and never run — test10 would
          # have been invisible to CI. Discover them instead.
          found=0
          for t in $(ls test*.js 2>/dev/null | sort -V); do
            echo "running $t"; node "$t" || exit 1; found=1
          done
          [ "$found" -eq 1 ] || echo "no node test suites present in this repo"

      - name: Static audit (repo root)
        run: python3 tools/static-audit.py .
